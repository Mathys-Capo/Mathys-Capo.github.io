<link rel="stylesheet" href="../ressources/css/pages/fact.css">


<body>
  <section class="funfact-section d-flex flex-column justify-content-center align-items-center text-white">
    <h1 class="text-center mb-4">Fun Fact !</h1>

    <div class="fact-card text-center p-4 rounded" id="fact-card">
      <p id="fact-text">Chargement...</p>
      <button id="new-fact-btn" class="btn btn-primary mt-3">Nouvelle Fun Fact</button>
      <button id="today-fact-btn" class="btn btn-primary mt-3">Fun Fact du jour</button>
    </div>
  </section>
</body>

<script type="module">
import { Success } from "../ressources/js/success.js";
import { CookieManager } from "../ressources/js/cookieManager.js";
  //https://uselessfacts.jsph.pl 
const factText = document.getElementById("fact-text");
const newFactBtn = document.getElementById("new-fact-btn");
const todayFactBtn = document.getElementById("today-fact-btn");

async function getFact(type) {
  try {
    factText.textContent = "Chargement...";

    const response = await fetch("https://uselessfacts.jsph.pl/api/v2/facts/"+type);
    if (!response.ok) throw new Error("Erreur API");

    const data = await response.json();
    console.log(data)
    factText.textContent = data.text;
  } catch (error) {
    factText.textContent = "Impossible de récupérer la fun fact. 😢";
    console.error(error);
  }
}

async function getTodayFact(){
    getFact('today');
}
async function getRandomFact(){
    getFact('random');
}

getTodayFact();

newFactBtn.addEventListener("click", getRandomFact);
todayFactBtn.addEventListener("click", getTodayFact);

Success.trackPage("facts");
</script>

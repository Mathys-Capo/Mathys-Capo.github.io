---
layout: layout_basic
permalink: /contact/
title: Pour me contacter
crop_waves: true;
waves: true
---

<link rel="stylesheet" href="../ressources/css/pages/contact.css">

<section class="container d-flex align-items-center">
  <div class="w-100">

    <div class="row justify-content-center text-center mb-5">
      <div class="col-12 col-md-8"> 
        <h2 class="mb-3">Contact</h2>
        <p>
          N’hésitez pas à me contacter pour un projet, un stage ou toute question.
        </p>
      </div>
    </div>

        <div class="row justify-content-center g-4">
          {% for contact in site.data.information.contacts %}
            <div class="col-12 col-md-4">
              <div class="card h-100 shadow-sm">
                <div class="card-body text-center">
                  <i class="{{contact.logoBootstrap}} display-4 mb-3 text-primary"></i>
                  <h5>{{contact.name}}</h5>
                  <a href="{{contact.url}}" class="text-decoration-none">
                    {{contact.url}}
                  </a>
                </div>
              </div>
            </div>
          {% endfor %}

        </div>

    </section>
 

<script type="module">
import { Success } from "../ressources/js/success.js";
import { CookieManager } from "../ressources/js/cookieManager.js";
import { MessageFlash } from "../ressources/js/messageFlash.js";

Success.trackPage("contact");

</script>

---
layout: layout_basic
permalink: /contact/
title: Pour me contacter
---
<link rel="stylesheet" href="../ressources/css/contact.css">

<section class="contact section d-flex align-items-center justify-content-center mt-5">
    <div class="container text-center">
        <h2 class="section-title text-primary ">Contact</h2>

        <div class="row justify-content-center bg-secondary bg-opacity-50">
            <!-- Coordonnées -->
            <div class="col-md-6">
                <h3 class="text-light mb-4">Mes Coordonnées</h3>
                <ul class="list-unstyled">
                    <li class="mb-3">
                        <i class="bi bi-envelope-fill text-primary me-2"></i>
                        <span class="fw-bold">Email :</span> <a href="mailto:{{site.data.information.mail.url}}" class="text-light">{{site.data.information.mail.url}}</a>
                    </li>
                    <li class="mb-3">
                        <i class="bi bi-linkedin text-primary me-2"></i>
                        <span class="fw-bold">LinkedIn :</span> <a href="{{site.data.information.linkedin.url}}" target="_blank" class="text-light">{{site.data.information.linkedin.url}}</a>
                    </li>
                    <li class="mb-3">
                        <i class="bi bi-github text-primary me-2"></i>
                        <span class="fw-bold">GitLab :</span> <a href="{{site.data.information.gitlab.url}}" target="_blank" class="text-light">{{site.data.information.gitlab.url}}</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>

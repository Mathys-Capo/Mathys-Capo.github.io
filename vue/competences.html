layout: layout_basic
permalink: /competences/
title: Mes compétences
---
<script src="../ressources/js/index.js"></script>
<script src="../ressources/js/competences.js"></script>
<link rel="stylesheet" href="../../ressources/css/competences.css"> 

<body>
    <section id="competences" class="container mt-5 py-5">
        <h2 class="text-center text-primary mb-5">Mes Compétences</h2>
        
        <div class="row justify-content-center">
            {% for competence in site.data.competences.competences %}
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm h-100">
                        <img src="{{competence.logo}}" class="card-img-top" alt="{{competence.titre}} Logo">
                        <div class="card-body">
                            <h5 class="card-title">{{competence.titre}}</h5>
                            <p class="card-text">{{competence.texte}}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </section>
</body>

<script src="../ressources/js/cartes.js" defer></script>
<script src="../ressources/js/index.js"></script>
<link rel="stylesheet" href="../ressources/css/pages/cartes.css">

<section class="cartes-section">
  <div class="container">
    <div class="cartes-zone d-flex flex-column flex-lg-row align-items-start gap-4">

      <!-- Zone principale -->
      <div class="main-card-zone flex-fill d-flex flex-column align-items-center gap-4">

        <!-- Titre -->
        <div class="text-center">
          <h2 class="mb-2">
            <i class="bi bi-suit-spade-fill me-2"></i>
            Jeu de cartes
          </h2>
          <p id="text-area" class="text-secondary">
            Pioche des cartes via l’API Deck of Cards
          </p>
        </div>

        <!-- Actions -->
        <div>
          <button id="new-deck-btn" class="btn btn-primary">
            <i class="bi bi-arrow-clockwise me-1"></i>
            Nouveau jeu
          </button>
        </div>

        <!-- Infos -->
        <div>
          <span class="badge bg-secondary fs-6">
            <i class="bi bi-layers me-1"></i>
            Cartes restantes :
            <span id="remaining-count">—</span>
          </span>
        </div>

        <!-- Carte piochée -->
        <div class="card shadow text-center bg-dark text-white border-secondary" style="width: 250px;">
          <div class="card-body">
            <p class="mb-2 text-secondary">
              <i class="bi bi-card-image me-1"></i>
              Carte piochée
            </p>
            <div id="card-area" class="card-slot mb-3">
              <i class="bi bi-question-lg fs-1 text-secondary"></i>
            </div>
            <button id="draw-card-btn" class="btn btn-outline-light w-100">
              <i class="bi bi-hand-index-thumb me-1"></i>
              Piocher une carte
            </button>
          </div>
        </div>

      </div>

      <!-- Zone piles (historique) -->
      <div class="piles-zone d-flex flex-column gap-3">
        <div class="d-flex gap-3">

          <!-- Hearts -->
          <div class="pile d-flex flex-column align-items-center">
            <span class="text-secondary mb-1"><i class="bi bi-heart-fill"></i></span>
            <div id="drawn-cards-area-hearts" class="d-flex flex-column gap-1"></div>
          </div>

          <!-- Clubs -->
          <div class="pile d-flex flex-column align-items-center">
            <span class="text-secondary mb-1"><i class="bi bi-suit-club-fill"></i></span>
            <div id="drawn-cards-area-clubs" class="d-flex flex-column gap-1"></div>
          </div>

          <!-- Spades -->
          <div class="pile d-flex flex-column align-items-center">
            <span class="text-secondary mb-1"><i class="bi bi-suit-spade-fill"></i></span>
            <div id="drawn-cards-area-spades" class="d-flex flex-column gap-1"></div>
          </div>

          <!-- Diamonds -->
          <div class="pile d-flex flex-column align-items-center">
            <span class="text-secondary mb-1"><i class="bi bi-suit-diamond-fill"></i></span>
            <div id="drawn-cards-area-diamonds" class="d-flex flex-column gap-1"></div>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>

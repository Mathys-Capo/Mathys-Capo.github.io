

<footer class="footer text-center">
    <hr class="footer-separator"/>
    <div class="container">

        <h2>Portfolio de {{ site.data.information.prenom }} {{ site.data.information.name }}</h2>

        <p class="footer-role">
            Développeur Web · Étudiant en informatique
        </p>

        <div id="imagesFooter" class="d-flex justify-content-center gap-4 mt-4">
            {% for contact in site.data.information.contacts %}
                <a href="{{contact.url}}" target="_blank" aria-label="{{contact.name}}">
                    <i class="{{contact.logoBootstrap}}"></i>
                </a>
            {% endfor %}
        </div>

        <p class="footer-copy mt-4">
            © {{ "now" | date: "%Y" }} Mathys Capo
        </p>

    </div>
</footer>
